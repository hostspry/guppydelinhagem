services:
  db:
    image: postgres:16-alpine
    container_name: guppy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guppy
    ports:
      - "5432:5432"
    volumes:
      - guppy_db_data:/var/lib/postgresql/data

volumes:
  guppy_db_data:
